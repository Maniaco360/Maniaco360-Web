name: Publicar la web
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Reconstruye sola cada seis horas para recoger los videos nuevos de las
  # listas de YouTube sin necesidad de un push. Minuto 25 a proposito: las
  # tareas programadas en punto se retrasan mas.
  schedule:
    - cron: '25 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow (miniaturas de imagen)
        run: python -m pip install --quiet pillow
      - name: Construir
        run: python construir.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: salida
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
